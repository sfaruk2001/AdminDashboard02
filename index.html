<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="side-header">
                <div class="logo">
                    <img src="./images/view-dashboard.svg" alt="dashboard-logo" class="icon-color">
                    <div class="dash-board">Dashboard</div>
                </div>
            </div>
            <div class="side-nav">
                <ul class="nav-menu">
                    <li>
                        <img src="./images/home.svg" alt="house-icon" class="icon-color nav-icons">
                        Home
                    </li>
                    <li>
                        <img src="./images/card-account-details-outline.svg" alt="profile-icon" class="icon-color nav-icons"> 
                        Profile
                    </li>
                    <li>
                        <img src="./images/message.svg" alt="message-icon" class="icon-color nav-icons">
                        Messages
                    </li>
                    <li>
                        <img src="./images/clock-time-three.svg" alt="clock" class="icon-color nav-icons">
                        History
                    </li>
                    <li>
                        <img src="./images/note-multiple.svg" alt="tasks" class="icon-color nav-icons">
                        Tasks
                    </li>
                    <li>
                        <img src="./images/account-group.svg" alt="community" class="icon-color nav-icons">
                        Communities
                    </li>
                </ul>
            </div>
            <div class="side-settings">
                <ul class="nav-settings">
                    <li>
                        <img src="./images/cog.svg" alt="settings" class="icon-color nav-icons">
                        Settings
                    </li>
                    <li>
                        <img src="./images/help-box.svg" alt="help" class="icon-color nav-icons">
                        Support
                    </li>
                    <li>
                        <img src="./images/shield-check.svg" alt="privacy" class="icon-color nav-icons">
                        Privacy
                    </li>
                </ul>
            </div>
        </div>
        <div class="content-wrapper">
            <div class="header">
                <div class="header-one">
                    <div class="h1-search">
                        <img src="./images/magnify.svg" alt="search icon" class="nav-icons">
                        <input type="search" id="search" name="search-bar" />
                    </div>
                    <div class="h1-bellProfile">
                        <img src="./images/bell-outline.svg" alt="bell" class="nav-icons">
                        <img src="./images/bat.svg" alt="batman-profile-icon" class="nav-icons">
                        <div class="profile-name">Shihab Faruk</div>
                    </div>
                </div>
                <div class="header-two">
                    <div class="h2-profile">
                        <img src="./images/bat.svg" alt="bigger batman icon">
                        <div class="h2-hello-user">
                            <div>Hi there,</div>
                            <div>Shihab Faruk (@shihab)</div>
                        </div>
                    </div>
                    <div class="h2-buttons">
                        <button>New</button>
                        <button>Upload</button>
                        <button>Share</button>
                    </div>
                </div>
            </div>
            <div class="main-content"></div>
        </div>
    </div>
</body>
</html>
